# UN/LOCODE -> city, plus other names people use for the same port
# (PLAN.md D-46). Gate 1 resolves a candidate's origin/destination through
# the LOCODE, the city or an alias (case-insensitive) to the LOCODE.
ports:
  INMAA: {city: Chennai, aliases: [Madras, Chennai Port]}
  INNSA: {city: Nhava Sheva, aliases: [JNPT, Jawaharlal Nehru Port, Navi Mumbai, Nhava Sheva JNPT]}
  INMUN: {city: Mundra, aliases: [Mundra Port]}
  INCOK: {city: Cochin, aliases: [Kochi, Vallarpadam]}
  INVTZ: {city: Visakhapatnam, aliases: [Vizag, Vishakhapatnam]}
  INPAV: {city: Pipavav, aliases: [Pipavav Victor, Port Pipavav]}
  INTUT: {city: Tuticorin, aliases: [Thoothukudi, VOC Port]}
  NLRTM: {city: Rotterdam, aliases: [Port of Rotterdam]}
  DEHAM: {city: Hamburg, aliases: [Port of Hamburg]}
  BEANR: {city: Antwerp, aliases: [Antwerpen, Antwerp-Bruges]}
  GBFXT: {city: Felixstowe, aliases: [Port of Felixstowe]}
  ITGOA: {city: Genoa, aliases: [Genova]}
  ESBCN: {city: Barcelona, aliases: [Port of Barcelona]}
  AEJEA: {city: Jebel Ali, aliases: [Jebel Ali Dubai, Dubai Jebel Ali]}
  SGSIN: {city: Singapore, aliases: [Port of Singapore]}
  LKCMB: {city: Colombo, aliases: [Port of Colombo]}
  CNSGH: {city: Shanghai, aliases: [Port of Shanghai, Yangshan]}
  USSAV: {city: Savannah, aliases: [Port of Savannah, Garden City]}
  # display names where the official UN/LOCODE name is awkward or annotated (D-49)
  QAHMD: {city: Hamad, aliases: [Hamad Port, Port of Hamad]}
  INHZA: {city: Hazira, aliases: [Hazira Port, Surat Hazira]}
  PKBQM: {city: Port Qasim, aliases: [Muhammad Bin Qasim, Bin Qasim]}
  BHKBS: {city: Khalifa Bin Salman, aliases: [Khalifa Bin Salman Port, KBSP]}
  JPNGO: {city: Nagoya, aliases: [Port of Nagoya]}
  IDJKT: {city: Jakarta, aliases: [Tanjung Priok, Port of Jakarta]}
  SEGOT: {city: Gothenburg, aliases: [Goteborg, Port of Gothenburg]}
  INCCU: {city: Kolkata, aliases: [Calcutta]}
  MYPKG: {city: Port Klang, aliases: [Pelabuhan Klang, Klang]}
